# Prefect deployments for nyc-taxi-elt (prod).
# Runs on a Prefect Managed work pool, so there is no worker to maintain.
name: nyc-taxi-elt
prefect-version: ">=3.9.0"

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/patuh-istizhar/nyc-taxi-elt.git
      branch: main

deployments:
  - name: weekly
    description: "Weekly NYC TLC ELT (prod): loads every incomplete month, skips finished ones."
    entrypoint: nyc_taxi_elt/flows/ingest.py:ingest
    tags: ["nyc-taxi", "prod"]
    parameters:
      taxi_type: all
      force: false
    concurrency_limit: 1
    schedules:
      # Weekly: TLC publish dates slip, so a retry cadence works better than one
      # fixed day. Already-loaded months make the run exit immediately.
      - cron: "0 6 * * 1"
        timezone: UTC
        active: true
    work_pool:
      name: nyc-taxi-managed
      # The smoke deployment reuses this exact runtime through the YAML anchor.
      job_variables: &prod_job
        # Keep in sync with pyproject.toml; duckdb must match a MotherDuck-supported version.
        pip_packages:
          - duckdb==1.5.6
          - boto3>=1.43.118
          - requests>=2.34.2
        env:
          ENV: prod
          S3_ENDPOINT_URL: https://s3.us-east-005.backblazeb2.com
          S3_REGION: us-east-005
          S3_BUCKET: zoomcamp
          WAREHOUSE_DATABASE: md:nyc_taxi
          # Existing prod data lives in this schema.
          WAREHOUSE_SCHEMA: zoomcamp
          # Keys come from Prefect Secret blocks:
          # s3-access-key-id, s3-secret-access-key, motherduck-token.

  - name: smoke
    description: "Connectivity check for S3 and the warehouse (prod)."
    entrypoint: nyc_taxi_elt/flows/smoke.py:smoke
    tags: ["nyc-taxi", "prod"]
    work_pool:
      name: nyc-taxi-managed
      job_variables: *prod_job
