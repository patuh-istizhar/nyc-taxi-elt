# Deployment configuration for the NYC Taxi ELT pipeline.
# Managed by Prefect Cloud (prefect:managed work pool).
name: nyc-taxi
prefect-version: 3.9.0

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/patuh-istizhar/nyc-taxi-prefect.git
      branch: main

deployments:
  - name: nyc-taxi-weekly
    description: "Weekly NYC TLC ELT: loads the newest incomplete month, skips finished ones."
    entrypoint: flows/nyc_taxi.py:nyc_taxi
    tags: ["nyc-taxi", "managed"]
    parameters:
      taxi_type: all
      force_download: false
    concurrency_limit: 1
    schedules:
      # Weekly: TLC publish dates slip, so a retry cadence works better than one
      # fixed day. Already-loaded months make the run exit immediately.
      - cron: "0 6 * * 1"
        timezone: UTC
        active: true
    work_pool:
      name: nyc-taxi-managed
      # Both deployments run the same code, so the smoke deployment reuses this
      # exact runtime block through the YAML anchor.
      job_variables: &job_variables
        pip_packages:
          - duckdb==1.5.6
          - boto3>=1.43.118
          - requests>=2.34.2
        env:
          B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          B2_REGION: us-east-005
          B2_BUCKET: zoomcamp
          MOTHERDUCK_DATABASE: nyc_taxi
          MOTHERDUCK_SCHEMA: zoomcamp
          NYC_TLC_SOURCE_BASE: https://d37ci6vzurychx.cloudfront.net/trip-data

  - name: nyc-taxi-smoke
    description: "Connectivity check for B2 and MotherDuck."
    entrypoint: flows/smoke.py:smoke
    tags: ["nyc-taxi", "managed"]
    work_pool:
      name: nyc-taxi-managed
      job_variables: *job_variables
